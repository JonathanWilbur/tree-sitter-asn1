name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - nvim-queries/**
      - parser.json
      - bindings/**
      - binding.gyp
      - tree-sitter.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - nvim-queries/**
      - parser.json
      - bindings/**
      - binding.gyp
      - tree-sitter.json
      - .github/workflows/ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          # Match package-lock.json so `generate: true` does not fail on a
          # header-comment drift from a newer CLI (0.27 vs committed 0.25.6).
          tree-sitter-ref: v0.27.0
      - name: Run parser and binding tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: ${{ runner.os == 'Linux' }}
          test-node: true
          test-python: true
          test-go: true
          # setup-swift 6.1 cannot build against the Xcode 26 / Swift 6.3 SDK
          # on macos-latest. Re-enable when the action tracks that toolchain.
          test-swift: false
      - name: Parse sample files
        uses: tree-sitter/parse-action@v4
        id: parse-files
        with:
          files: |
            test/asn1/**/*.asn1
            test/asn1/**/*.asn
      - name: Upload failures artifact
        uses: actions/upload-artifact@v4
        if: "!cancelled() && steps.parse-files.outcome == 'failure'"
        with:
          name: failures-${{ runner.os }}
          path: ${{ steps.parse-files.outputs.failures }}

  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-check
        run: |-
          if git diff --quiet HEAD^ -- src/scanner.c; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Run the fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'
