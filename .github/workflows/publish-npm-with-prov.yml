# Copied from tree-sitter/workflows/.github/workflows/package-npm.yml@main
# but modified to include provenance.
name: Publish package (npm)

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build_wasm:
    name: Build Wasm binaries
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: "26"
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Regenerate parser
        run: |
          while read -r grammar_dir; do
            pushd "$grammar_dir"
            npm x -- tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
        env:
          TREE_SITTER_ABI_VERSION: 15
      - name: Build Wasm binaries
        run: |-
          while read -r grammar_dir; do
            npm x -- tree-sitter build --wasm "$grammar_dir"
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: "*.wasm"
          name: prebuilds-wasm
          retention-days: 2

  build_node:
    name: Build NodeJS binaries on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2022
          - windows-11-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: "26"
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Regenerate parser
        shell: bash
        run: |
          while read -r grammar_dir; do
            grammar_dir="${grammar_dir%$'\r'}"
            pushd "$grammar_dir"
            npm x -- tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
      - name: Build binary
        run: npm x -- prebuildify -t 20.19.5
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: prebuilds/**
          name: prebuilds-${{matrix.os}}
          retention-days: 2

