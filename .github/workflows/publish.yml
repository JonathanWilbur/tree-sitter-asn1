name: Publish packages

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # The shared release.yml workflow runs `gh release create` from a tag push.
  # This workflow is triggered by an already-published GitHub release, so that
  # job is omitted. Wasm and source tarball assets can still be attached to the
  # release in the GitHub UI if needed.

  # I have to use this instead of .github/workflows/publish-npm-with-prov.yml
  # for the first time. You can't configure trusted publishing until you
  # already have the package published. PyPI can do that, though.
  # npm:
  #   uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
  #   secrets:
  #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # TODO: Use hashed versions.
  crates:
    # Failed to build and publish because the shared workflow always uses the
    # latest version of the CLI, which tends to produce uncommitted changes.
    # uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    uses: ./.github/workflows/publish-crates.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    with:
      generate: true

  # Using the separate workflow for this to get provenance, and to generate
  # attestations and SBOMs.
  # See: .github/workflows/publish-pypi-with-prov.yml
  # pypi:
  #   uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
  #   secrets:
  #     PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
  #   with:
  #     generate: true
